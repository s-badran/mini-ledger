# The project name groups the containers, network and volume in `docker ps`,
# the Dev Container, and `docker compose -p` commands. Keep it stable.
name: mini-ledger

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    # 5433 on the host: 5432 is usually already taken by whatever Postgres
    # people have running locally.
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 2s
      timeout: 2s
      retries: 20

volumes:
  pgdata:
