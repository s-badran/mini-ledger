# Merged on top of ../docker-compose.yml by Dev Containers (see devcontainer.json).
# Plain `docker compose up -d db` from the README never reads this file.
services:
  app:
    image: mcr.microsoft.com/devcontainers/python:1-3.12-bookworm
    command: sleep infinity
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Inside the compose network Postgres answers on db:5432. The host port
      # 5433 in docker-compose.yml is for tools running outside the network.
      LEDGER_DATABASE_URL: postgresql+psycopg://ledger:ledger@db:5432/ledger
      LEDGER_TEST_DATABASE_URL: postgresql+psycopg://ledger:ledger@db:5432/ledger_test
    volumes:
      # Compose resolves relative paths against the project directory, which is
      # the folder of the *first* compose file (../docker-compose.yml, the repo
      # root). So "." is the repo, not the .devcontainer folder. Using ".."
      # here would mount the parent directory.
      - .:/workspaces/mini-ledger:cached
