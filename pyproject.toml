[project]
name = "mini-ledger"
version = "0.1.0"
description = "A small double-entry ledger API."
readme = "README.md"
requires-python = "==3.12.*"
license = { text = "MIT" }
authors = [{ name = "Saeed Badran", email = "salouri@gmail.com" }]
dependencies = [
    "alembic==1.20.1",
    "fastapi==0.162.0",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "sqlalchemy==2.1.6",
    "uvicorn[standard]==0.54.0",
]

[project.optional-dependencies]
dev = [
    "httpx2==2.16.0",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.17.3",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# FastAPI reads the response model from the annotation, so Depends() in a
# default is the intended pattern, not a mutable-default bug.
ignore = ["B008"]

[tool.ruff.lint.isort]
# The migrations live in ./alembic, which ruff would otherwise read as the
# alembic package itself.
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests", "alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
